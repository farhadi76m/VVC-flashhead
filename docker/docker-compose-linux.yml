# FlashHead Streaming API — Docker Compose  (native Linux host)
# ─────────────────────────────────────────────────────────────────────────────
# This is the NATIVE LINUX variant. For Docker Desktop on WSL2 use
# docker/docker-compose.yml instead (it passes /dev/dxg by hand).
#
# Run from the repo root:
#     docker compose -f docker/docker-compose-linux.yml up -d --build
#
# Requires:
#   • NVIDIA driver 525+ on the host          (check: nvidia-smi)
#   • NVIDIA Container Toolkit installed and wired into Docker
#         sudo apt-get install -y nvidia-container-toolkit
#         sudo nvidia-ctk runtime configure --runtime=docker
#         sudo systemctl restart docker
#     verify:  docker run --rm --gpus all nvidia/cuda:12.8.1-base-ubuntu22.04 nvidia-smi
#   • Docker Compose v2.30+ for the `gpus:` key (older versions: use the
#     `deploy:` block at the bottom of this file instead).
#
# Model weights stay on the host. CHECKPOINTS_DIR selects the host directory
# mounted read-only into the container (default: the repository's models dir).
# ─────────────────────────────────────────────────────────────────────────────
services:
  flashhead-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: flashhead-api:latest
    container_name: flashhead-api
    ports:
      - "8000:8000"
    volumes:
      # Set CHECKPOINTS_DIR to an absolute host path if the checkpoints are not
      # stored in the repository's models directory.
      - ${CHECKPOINTS_DIR:-../models}:/checkpoints:ro
    environment:
      # Start without loading a model. Select a mounted checkpoint via the API:
      # curl -X POST http://localhost:8000/model/load \
      #   -F ckpt_dir=/checkpoints/SoulX-FlashHead-1_3B \
      #   -F wav2vec_dir=/checkpoints/wav2vec2-base-960h \
      #   -F model_type=lite
      AUTOLOAD: "0"
      # PORT: "8000"
      # Pick specific GPUs instead of `gpus: all` below, e.g. NVIDIA_VISIBLE_DEVICES: "0"
    shm_size: "8gb"
    restart: unless-stopped

    # GPU access on a native Linux host: the NVIDIA container hook finds
    # /dev/nvidia* plus a matching kernel driver, so the normal path works and
    # none of the WSL2 workarounds (/dev/dxg, /usr/lib/wsl, LD_LIBRARY_PATH)
    # are needed — they would in fact break CUDA here.
    gpus: all

    # Compose older than v2.30 does not understand `gpus:`. Comment the line
    # above out and use this instead:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all          # or: device_ids: ["0"]
    #           capabilities: [gpu]
